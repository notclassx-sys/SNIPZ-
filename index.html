
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=Teams&backgroundColor=10b981">
  
  <title>TEAMS</title>
  
  <style>
    @charset "UTF-8";
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --bg: #fdfdfd;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      margin: 0;
      color: #0f172a;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    /* Smooth Transitions */
    .page-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    
    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      70% { transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .animate-fade-up { animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-slide-right { animation: slideInRight 0.5s ease forwards; }

    /* Staggered delays */
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }

    .m3-card {
      background: white;
      border-radius: 32px;
      padding: 20px;
      border: 1px solid rgba(0,0,0,0.03);
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.04);
      transition: all 0.3s ease;
    }
    .m3-card:active { transform: scale(0.98); }

    header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px);
      padding-top: var(--safe-top);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
      height: 94px;
    }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      padding-bottom: var(--safe-bottom);
      border-top: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
      display: flex;
    }
    .label-text { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .btn-primary {
      background: var(--primary);
      color: white;
      border-radius: 20px;
      font-weight: 800;
      box-shadow: 0 8px 20px -6px rgba(16, 185, 129, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-primary:active { transform: scale(0.95); box-shadow: 0 4px 10px -4px rgba(16, 185, 129, 0.4); }
    
    .input-m3 {
      background: #f8fafc;
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 16px 20px;
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .input-m3:focus { border-color: var(--primary); background: white; outline: none; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    window.process = { env: { API_KEY: '' } };
    window.haptic = (type = 'light') => {
      if ('vibrate' in navigator) {
        const patterns = { light: 10, medium: 25, heavy: 45 };
        navigator.vibrate(patterns[type] || 20);
      }
    };
  </script>
