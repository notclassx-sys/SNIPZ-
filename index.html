
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Main Manifest -->
  <link rel="manifest" href="manifest.json">
  <!-- Backup for the typo in your screenshot -->
  <link rel="alternate-manifest" href="mainfest.json">
  
  <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=Teams&backgroundColor=10b981">
  
  <title>TEAMS</title>
  
  <style>
    @charset "UTF-8";
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --bg: #fdfdfd;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      margin: 0;
      color: #0f172a;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Advanced Animations */
    @keyframes springUp {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      70% { transform: translateY(-5px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .animate-spring { animation: springUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-slide { animation: slideIn 0.4s ease-out forwards; }

    /* Staggered Delay Helpers */
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }

    .m3-card {
      background: white;
      border-radius: 32px;
      padding: 24px;
      border: 1px solid rgba(0,0,0,0.04);
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.03);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .m3-card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px -12px rgba(16, 185, 129, 0.1); }
    .m3-card:active { transform: scale(0.97); }

    header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(24px);
      padding-top: var(--safe-top);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
      height: 96px;
    }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(24px);
      padding-bottom: var(--safe-bottom);
      border-top: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
      display: flex;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
      border-radius: 24px;
      font-weight: 800;
      box-shadow: 0 12px 24px -8px rgba(16, 185, 129, 0.5);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-primary:active { transform: scale(0.94); }
    
    .input-m3 {
      background: #f1f5f9;
      border: 2px solid transparent;
      border-radius: 22px;
      padding: 18px 24px;
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .input-m3:focus { border-color: var(--primary); background: white; outline: none; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    window.process = { env: { API_KEY: '' } };
    window.haptic = (type = 'light') => {
      if ('vibrate' in navigator) {
        const patterns = { light: 10, medium: 30, heavy: 60 };
        navigator.vibrate(patterns[type] || 20);
      }
    };
  </script>
