
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3b33ff">
  
  <meta name="application-name" content="TEAMS Workspace">
  <meta name="apple-mobile-web-app-title" content="TEAMS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="icon" type="image/png" href="https://api.dicebear.com/7.x/initials/png?seed=SNIPX&backgroundColor=3b33ff&width=192&height=192">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/initials/png?seed=SNIPX&backgroundColor=3b33ff&width=192&height=192">
  
  <title>TEAMS Workspace</title>
  
  <style>
    @charset "UTF-8";
    :root {
      --primary: #3b33ff;
      --primary-dark: #2a22cc;
      --bg: #f8fafc;
      --surface: #ffffff;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      --admob-banner-height: 56px; 
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      margin: 0;
      color: #0f172a;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      letter-spacing: -0.01em;
    }
    
    @keyframes m3-up {
      0% { opacity: 0; transform: translateY(40px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes m3-fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes bounce-sm {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.96); }
    }
    
    .animate-m3 { animation: m3-up 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .animate-fade { animation: m3-fade 0.4s ease-out forwards; }
    .btn-bounce:active { animation: bounce-sm 0.15s ease-in-out; }

    .m3-card {
      background: var(--surface);
      border-radius: 28px;
      padding: 24px;
      border: 1px solid rgba(0,0,0,0.04);
      box-shadow: 0 4px 20px -5px rgba(0,0,0,0.02);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .m3-card:active { transform: scale(0.98); opacity: 0.9; }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    input, select, textarea {
      font-family: inherit;
      -webkit-appearance: none;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#3b33ff',
            surface: '#ffffff',
            accent: '#10b981',
          },
          borderRadius: {
            '3xl': '24px',
            '4xl': '32px',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    window.process = { env: { API_KEY: '' } };
    window.haptic = (type = 'light') => {
      if ('vibrate' in navigator) {
        const patterns = { light: 10, medium: 30, heavy: 60 };
        navigator.vibrate(patterns[type] || 10);
      }
    };
  </script>
<script type="importmap">
{

    "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js",

  }
}
</script>
</head>

</html>
