
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Manifest (Path must be exactly /manifest.json for most build tools) -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="https://api.dicebear.com/7.x/shapes/svg?seed=Teams&backgroundColor=10b981">
  
  <title>TEAMS</title>
  
  <style>
    @charset "UTF-8";
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --bg: #fdfdfd;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg);
      margin: 0;
      color: #0f172a;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    @keyframes springUp {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      70% { transform: translateY(-5px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .animate-spring { animation: springUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-float { animation: float 3s ease-in-out infinite; }

    .m3-card {
      background: white;
      border-radius: 32px;
      padding: 24px;
      border: 1px solid rgba(0,0,0,0.04);
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.03);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(24px);
      padding-top: var(--safe-top);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
      height: 96px;
    }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(24px);
      padding-bottom: var(--safe-bottom);
      border-top: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
      display: flex;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
      border-radius: 24px;
      font-weight: 800;
      box-shadow: 0 12px 24px -8px rgba(16, 185, 129, 0.5);
    }
    
    .input-m3 {
      background: #f1f5f9;
      border: 2px solid transparent;
      border-radius: 22px;
      padding: 18px 24px;
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .input-m3:focus { border-color: var(--primary); background: white; outline: none; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    window.process = { env: { API_KEY: '' } };
    
    // Improved Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
          .then(reg => console.log('PWA Ready', reg))
          .catch(err => console.error('PWA Setup Failed', err));
      });
    }

    window.haptic = (type = 'light') => {
      if ('vibrate' in navigator) {
        const patterns = { light: 10, medium: 30, heavy: 60 };
        navigator.vibrate(patterns[type] || 20);
      }
    };
  </script>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
