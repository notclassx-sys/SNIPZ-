
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>SNIPX LIBRARY</title>
  
  <style>
    @charset "UTF-8";
    
    :root {
      --m3-primary: #10b981;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    .stat-grid {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 16px !important;
      width: 100% !important;
    }

    .m3-card {
      background: white;
      border-radius: 2rem;
      border: 1px solid rgba(0,0,0,0.04);
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }

    .avatar-fixed-md { width: 56px !important; height: 56px !important; border-radius: 18px; object-fit: cover; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px);
      padding-top: var(--safe-top);
      border-bottom: 1px solid #f1f5f9;
      z-index: 100;
    }

    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      padding-bottom: var(--safe-bottom);
      border-top: 1px solid #f1f5f9;
      z-index: 100;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  
  <script>
    window.process = { env: { API_KEY: '' } };
    window.haptic = (type = 'light') => {
      if ('vibrate' in navigator) {
        if (type === 'light') navigator.vibrate(10);
        else if (type === 'heavy') navigator.vibrate(30);
      }
    };
  </script>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
